name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Forensic audit
        run: python scripts/forensic_audit.py
      - name: Validate installer packaging
        run: python scripts/build_installer.py validate
      - name: Pytest (portable — exclude windows marker)
        env:
          WINOS_BACKEND: fake
          WINOS_REQUIRE_AUTH: "true"
        run: pytest -q --tb=short -m "not windows"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,windows]"
      - name: Forensic audit
        run: python scripts/forensic_audit.py
      - name: Validate installer packaging
        run: python scripts/build_installer.py validate
      - name: Pytest portable (fake backend)
        env:
          WINOS_BACKEND: fake
          WINOS_REQUIRE_AUTH: "true"
        run: pytest -q --tb=short -m "not windows"
      - name: Pytest Windows hard tests
        env:
          WINOS_BACKEND: windows
          WINOS_REQUIRE_AUTH: "true"
        run: pytest -q --tb=short -m windows
