name: Build

on:
  push:
    tags: ["v*"]
  # Packaging changes must prove the artifact still runs BEFORE they land.
  # Scoped with paths so ordinary PRs never pay for a Windows runner.
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "installer/**"
      - "scripts/build_installer.py"
      - "scripts/artifact_smoke.py"
      - "windows_os_api/cli/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" build pyinstaller
      - name: Validate packaging
        run: python scripts/build_installer.py validate
      - name: Python wheel/sdist
        run: python -m build --outdir dist-python
      - name: Portable (Linux ELF via PyInstaller)
        run: python scripts/build_installer.py build-portable
      - name: Artifact smoke (run the frozen ELF for real)
        # Launches dist/winos-api, polls /v1/health over real HTTP, checks the
        # served backend and that auth is enforced, then verifies teardown.
        # A binary that builds but cannot start fails HERE, not at the user.
        run: python scripts/artifact_smoke.py --expect-backend linux
      - name: Package Linux portable (shared helper)
        # Same naming as build-linux.yml: dist/winos-api-portable-linux.zip
        run: python scripts/build_installer.py package-linux
      - name: Upload Linux portable
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-portable
          path: |
            dist/winos-api-portable-linux.zip
            dist/winos-api-portable-linux.tar.gz
            dist/winos-api
            dist/checksums-linux.txt
          if-no-files-found: error
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-python
          path: |
            dist-python/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,windows]" pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Validate packaging
        run: python scripts/build_installer.py validate
      - name: Build portable onefile
        run: python scripts/build_installer.py build-portable
      - name: Artifact smoke (run the frozen EXE for real)
        # The gap this closes: PyInstaller onefile fails at RUNTIME, not at build
        # time. A dropped hidden import (comtypes, uiautomation, pywin32) yields
        # an EXE that builds green and dies on launch. This starts the real
        # binary, polls /v1/health, asserts the Windows backend is served and
        # that auth is enforced, then checks nothing is left running.
        run: python scripts/artifact_smoke.py --expect-backend windows
      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\winos-api.exe portable\ -ErrorAction Stop
          Copy-Item installer\service_scripts\* portable\ -Recurse
          if (Test-Path installer\README.md) { Copy-Item installer\README.md portable\ }
          Compress-Archive -Path portable\* -DestinationPath dist\winos-api-portable-windows.zip -Force
      - name: Build Setup.exe (Inno)
        run: python scripts/build_installer.py build-installer
      - name: Installer smoke (install, run the installed EXE, uninstall)
        # WinOsApi-Setup has been shipped without anyone ever installing it.
        # This drives the real lifecycle: silent install, check the layout the
        # .iss promises, run the INSTALLED binary (what the user actually
        # receives), silent uninstall, verify nothing is left behind.
        # Installs to a scratch dir, never the default location.
        run: python scripts/installer_smoke.py
      - name: Checksums
        shell: pwsh
        run: |
          $files = @()
          if (Test-Path dist) { $files += Get-ChildItem dist -File | ForEach-Object { $_.FullName } }
          if (Test-Path installer\output) { $files += Get-ChildItem installer\output -File | ForEach-Object { $_.FullName } }
          python scripts/build_installer.py checksums @files -o dist\checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/
            installer/output/
          if-no-files-found: error
