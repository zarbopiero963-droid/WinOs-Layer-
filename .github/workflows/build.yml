name: Build

on:
  # Artifact + installer smoke are expensive (windows-latest is 2x).
  # Start from Actions → Build → Run workflow when you want a shippable build.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" build pyinstaller
      - name: Validate packaging
        run: python scripts/build_installer.py validate
      - name: Python wheel/sdist
        run: python -m build --outdir dist-python
      - name: Portable (Linux ELF via PyInstaller)
        run: python scripts/build_installer.py build-portable
      - name: Artifact smoke (run the frozen ELF for real)
        run: python scripts/artifact_smoke.py --expect-backend linux
      - name: Package Linux portable (shared helper)
        run: python scripts/build_installer.py package-linux
      - name: Upload Linux portable
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-portable
          path: |
            dist/winos-api-portable-linux.zip
            dist/winos-api-portable-linux.tar.gz
            dist/winos-api
            dist/checksums-linux.txt
          if-no-files-found: error
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-python
          path: |
            dist-python/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,windows]" pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Install NSSM for hard service lifecycle smoke
        shell: pwsh
        run: |
          choco install nssm --version 2.24.101.20180116 --allow-downgrade --force -y --no-progress
          # Official payload lives under ChocolateyInstall\lib\nssm*\tools
          # (often tools\nssm-2.24\win64\nssm.exe). Never take ChocolateyInstall\bin:
          # that nssm.exe is a shim and cannot host an SCM service.
          $lib = Join-Path $env:ChocolateyInstall 'lib'
          $found = @(Get-ChildItem -Path $lib -Filter nssm.exe -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\bin\\' })
          $native = $found | Where-Object { $_.FullName -match '\\win64\\' } | Select-Object -First 1
          if (-not $native) { $native = $found | Select-Object -First 1 }
          if (-not $native) {
            Get-ChildItem -Path $lib -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'nssm*' } |
              ForEach-Object { Write-Host $_.FullName; Get-ChildItem $_.FullName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 FullName }
            throw "Native NSSM package payload not found; refusing Chocolatey shim"
          }
          Write-Host "Staging native NSSM from $($native.FullName)"
          Copy-Item $native.FullName installer\service_scripts\nssm.exe -Force
          Get-FileHash installer\service_scripts\nssm.exe -Algorithm SHA256
      - name: Validate packaging
        run: python scripts/build_installer.py validate
      - name: Build portable onefile
        run: python scripts/build_installer.py build-portable
      - name: Artifact smoke (run the frozen EXE for real)
        run: python scripts/artifact_smoke.py --expect-backend windows
      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\winos-api.exe portable\ -ErrorAction Stop
          Copy-Item installer\service_scripts\* portable\ -Recurse
          if (Test-Path installer\README.md) { Copy-Item installer\README.md portable\ }
          Compress-Archive -Path portable\* -DestinationPath dist\winos-api-portable-windows.zip -Force
      - name: Build Setup.exe (Inno)
        run: python scripts/build_installer.py build-installer
      - name: Installer and Windows service smoke
        run: python scripts/installer_smoke.py
      - name: Checksums
        shell: pwsh
        run: |
          $files = @()
          if (Test-Path dist) { $files += Get-ChildItem dist -File | ForEach-Object { $_.FullName } }
          if (Test-Path installer\output) { $files += Get-ChildItem installer\output -File | ForEach-Object { $_.FullName } }
          python scripts/build_installer.py checksums @files -o dist\checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/
            installer/output/
          if-no-files-found: error
