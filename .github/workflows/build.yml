name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyinstaller
      - name: PyInstaller
        run: pyinstaller installer/pyinstaller/winos-api.spec
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: warn
