name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"

jobs:
  build-windows-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,windows]" pyinstaller
          choco install innosetup -y
      - name: Stage native NSSM in Windows artifacts
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nssm.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'nssm'
          Invoke-WebRequest 'https://www.nssm.cc/ci/nssm-2.24-101-g897c7ad.zip' -OutFile $archive
          $expected = '99F5045FFFBFFB745D67FE3A065A953C4A3D9C253B868892D9B685B0EE7D07B8'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "NSSM archive checksum mismatch: $actual" }
          Expand-Archive $archive -DestinationPath $expanded -Force
          $native = Get-ChildItem $expanded -Filter nssm.exe -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]win64[\\/]' } | Select-Object -First 1
          if (-not $native) { throw "Native NSSM win64 binary not found in verified archive" }
          Copy-Item $native.FullName installer\service_scripts\nssm.exe -Force
          Get-FileHash installer\service_scripts\nssm.exe -Algorithm SHA256
      - run: python scripts/build_installer.py validate
      - run: python scripts/build_installer.py build-portable
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\winos-api.exe portable\
          Copy-Item installer\service_scripts\* portable\ -Recurse
          Compress-Archive -Path portable\* -DestinationPath dist\winos-api-portable-windows.zip -Force
      - run: python scripts/build_installer.py build-installer
      # N037: optional Authenticode when repo secrets present; always attest.
      # Secrets (optional): WINOS_SIGN_PFX_B64, WINOS_SIGN_PFX_PASSWORD,
      # WINOS_RELEASE_SIGNING_KEY, WINOS_RELEASE_PUBLISHER, WINOS_SIGN_TIMESTAMP_URL.
      - name: Sign + attest Windows artifacts (N037, optional cert)
        env:
          WINOS_SIGN_PFX_B64: ${{ secrets.WINOS_SIGN_PFX_B64 }}
          WINOS_SIGN_PFX_PASSWORD: ${{ secrets.WINOS_SIGN_PFX_PASSWORD }}
          WINOS_RELEASE_SIGNING_KEY: ${{ secrets.WINOS_RELEASE_SIGNING_KEY }}
          WINOS_RELEASE_PUBLISHER: ${{ secrets.WINOS_RELEASE_PUBLISHER }}
          WINOS_SIGN_TIMESTAMP_URL: ${{ vars.WINOS_SIGN_TIMESTAMP_URL }}
        run: |
          python scripts/build_installer.py sign-artifacts
      - run: python scripts/build_installer.py checksums
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            dist/
            installer/output/

  build-linux-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyinstaller build
      - run: python scripts/build_installer.py validate
      - run: python scripts/build_installer.py build-portable
      - run: python scripts/build_installer.py package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            dist/winos-api-portable-linux.zip
            dist/winos-api-portable-linux.tar.gz
            dist/checksums-linux.txt
            dist/winos-api
          if-no-files-found: error

  release:
    needs: [build-windows-artifacts, build-linux-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: python -m build
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts-windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts-linux
      - name: Stage release files
        env:
          WINOS_RELEASE_SIGNING_KEY: ${{ secrets.WINOS_RELEASE_SIGNING_KEY }}
          WINOS_RELEASE_PUBLISHER: ${{ secrets.WINOS_RELEASE_PUBLISHER }}
          WINOS_RELEASE_VERIFY_KEY: ${{ secrets.WINOS_RELEASE_VERIFY_KEY }}
        run: |
          mkdir -p release-dist
          cp -a dist/. release-dist/ || true
          find artifacts-windows -type f \( \
            -name '*.exe' -o -name '*.zip' -o -name 'checksums.txt' -o -name 'SHA256SUMS.txt' \
            -o -name 'RELEASE_ATTESTATION.json' \
          \) -exec cp -t release-dist {} +
          find artifacts-linux -type f \( \
            -name 'winos-api-portable-linux.zip' \
            -o -name 'winos-api-portable-linux.tar.gz' \
            -o -name 'checksums-linux.txt' \
            -o -name 'winos-api' \
            -o -name 'RELEASE_ATTESTATION.json' \
          \) -exec cp -t release-dist {} +
          # N028: never hash SHA256SUMS.txt into itself; fail-closed (no || true);
          # stable order; platform checksums.txt may be included as artifacts.
          mapfile -t ARTIFACTS < <(find release-dist -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' | sort)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "N028: no release artifacts to checksum" >&2
            exit 1
          fi
          python scripts/build_installer.py checksums "${ARTIFACTS[@]}" -o release-dist/SHA256SUMS.txt
          python scripts/build_installer.py verify-checksums release-dist/SHA256SUMS.txt --root release-dist
          # N037: attest staged artifacts (Ed25519 if secret present) + verify.
          mapfile -t ATTEST_FILES < <(find release-dist -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'RELEASE_ATTESTATION.json' | sort)
          if [ -n "${WINOS_RELEASE_SIGNING_KEY:-}" ]; then
            python scripts/build_installer.py attest-release "${ATTEST_FILES[@]}" \
              -o release-dist/RELEASE_ATTESTATION.json
            python scripts/build_installer.py verify-release release-dist/RELEASE_ATTESTATION.json \
              --root release-dist --require-attestation-signature
          else
            python scripts/build_installer.py attest-release "${ATTEST_FILES[@]}" \
              -o release-dist/RELEASE_ATTESTATION.json || true
            python scripts/build_installer.py verify-release release-dist/RELEASE_ATTESTATION.json \
              --root release-dist || true
          fi
          cat release-dist/SHA256SUMS.txt
          ls -la release-dist
      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: |
            release-dist/SHA256SUMS.txt
            release-dist/RELEASE_ATTESTATION.json
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          body: |
            ## Two builds — choose your OS

            - **Windows**: `WinOsApi-Setup-*.exe` + `winos-api-portable-windows.zip` — real `WindowsBackend` on Win32
            - **Linux**: `winos-api-portable-linux.zip` — FastAPI portable server (`FakeBackend`-capable), **not** a Windows emulator

            Default bind: `127.0.0.1:8765`. See `installer/README.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
