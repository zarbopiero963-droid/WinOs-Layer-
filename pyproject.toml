[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-os-api"
version = "1.0.0"
description = "Windows OS API Layer + Universal Adapter — FastAPI platform exposing Windows as OS API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WinOs-Layer Contributors" }]
keywords = ["windows", "fastapi", "automation", "os-api", "mcp", "adapter"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "websockets>=13.0",
  "PyYAML>=6.0",
  "cryptography>=43.0.0",
  "psutil>=6.0.0",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
  "comtypes>=1.4.0; sys_platform == 'win32'",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
]
all = ["windows-os-api[windows,dev]"]

[project.scripts]
winos-api = "windows_os_api.cli.main:main"
winos-mcp = "windows_os_api.api.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["windows_os_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "security: security-focused tests",
  "e2e: end-to-end tests",
  "windows: Windows-only hard tests (skip on Linux)",
  "requires_display: needs interactive desktop / UI Automation",
]

[tool.ruff]
line-length = 100
target-version = "py311"
